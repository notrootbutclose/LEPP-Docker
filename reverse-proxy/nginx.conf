user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;

    # Директория для кэша должна быть в блоке http
    fastcgi_cache_path /tmp/nginx_cache levels=1:2 keys_zone=php_cache:100m inactive=60m max_size=1g;

    upstream php_backends {
        server app-php-1:9000;
        server app-php-2:9000;
    }

    server {
        listen 80;
        server_name _;
        root /var/www/html;
        index index.php index.html;

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ \.php$ {
            try_files $uri =404;
            fastcgi_pass php_backends;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include fastcgi_params;

            # Настройки кэша FastCGI
            fastcgi_cache php_cache;
            fastcgi_cache_key "$scheme$request_method$host$request_uri";
            fastcgi_cache_valid 200 301 302 5m;
            fastcgi_cache_valid 404 1m;
            add_header X-Cache-Status $upstream_cache_status;
        }

        location /nginx_status {
            stub_status on;
            access_log off;
        }
    }
}
