global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'lepp-stack'

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'nginx'
    static_configs:
      - targets: ['nginx-exporter:9113']

  - job_name: 'postgresql'
    static_configs:
      - targets: ['postgres-exporter:9187']

  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']

  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: 'php-fpm-1'
    static_configs:
      - targets: ['php-fpm-exporter-1:9253']

  - job_name: 'php-fpm-2'
    static_configs:
      - targets: ['php-fpm-exporter-2:9253']

  - job_name: 'loki'
    static_configs:
      - targets: ['loki:3100']
