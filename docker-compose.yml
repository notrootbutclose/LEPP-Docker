services:
  # Nginx как reverse proxy и балансировщик
  reverse-proxy:
    image: nginx:alpine
    container_name: lemp-reverse-proxy
    restart: unless-stopped
    volumes:
      - ./reverse-proxy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./www:/var/www/html:ro
      - nginx_logs:/var/log/nginx
    ports:
      - "80:80"
    depends_on:
      - app-php-1
      - app-php-2
    networks:
      - lemp-network
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

  # PHP-FPM Backend 1
  app-php-1:
    build:
      context: ./app
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      - ./www:/var/www/html:rw
      - ./app/php-fpm.d/www.conf:/usr/local/etc/php-fpm.d/www.conf:ro
      - php_sessions:/var/lib/php/sessions
    environment:
      - PHP_MEMORY_LIMIT=${PHP_MEMORY_LIMIT}
      - PHP_MAX_EXECUTION_TIME=${PHP_MAX_EXECUTION_TIME}
      - PHP_UPLOAD_MAX_FILESIZE=${PHP_UPLOAD_MAX_FILESIZE}
      - PHP_POST_MAX_SIZE=${PHP_POST_MAX_SIZE}
    expose:
      - "9000"
    depends_on:
      - db
      - redis
    networks:
      - lemp-network

  # PHP-FPM Backend 2
  app-php-2:
    build:
      context: ./app
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      - ./www:/var/www/html:rw
      - ./app/php-fpm.d/www.conf:/usr/local/etc/php-fpm.d/www.conf:ro
      - php_sessions:/var/lib/php/sessions
    environment:
      - PHP_MEMORY_LIMIT=${PHP_MEMORY_LIMIT}
      - PHP_MAX_EXECUTION_TIME=${PHP_MAX_EXECUTION_TIME}
      - PHP_UPLOAD_MAX_FILESIZE=${PHP_UPLOAD_MAX_FILESIZE}
      - PHP_POST_MAX_SIZE=${PHP_POST_MAX_SIZE}
    expose:
      - "9000"
    depends_on:
      - db
      - redis
    networks:
      - lemp-network

  # MariaDB база данных
  db:
    image: mariadb:11
    container_name: lemp-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ALLOW_EMPTY_PASSWORD: "no"
      MYSQL_RANDOM_ROOT_PASSWORD: "no"
    volumes:
      - db_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - lemp-network
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 30s
      timeout: 20s
      retries: 5
      start_period: 60s

  # Redis для кэширования
  redis:
    image: redis:7-alpine
    container_name: lemp-redis
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - lemp-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Prometheus для сбора метрик
  prometheus:
    image: prom/prometheus:latest
    container_name: lemp-prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    ports:
      - "9090:9090"
    networks:
      - lemp-network

  # Grafana для визуализации
  grafana:
    image: grafana/grafana:latest
    container_name: lemp-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}
      - GF_INSTALL_PLUGINS=${GF_INSTALL_PLUGINS}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/datasources:/etc/grafana/provisioning/datasources:ro
    depends_on:
      - prometheus
    networks:
      - lemp-network

  # MySQL Exporter
  mysqld-exporter:
    image: prom/mysqld-exporter:v0.15.1
    container_name: lemp-mysqld-exporter
    restart: unless-stopped
    command:
      - --mysqld.username=exporter
      - --mysqld.address=db:3306
    environment:
      MYSQLD_EXPORTER_PASSWORD: "exporterpass123"
    depends_on:
      - db
    networks:
      - lemp-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9104/metrics"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  # Nginx Exporter
  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:latest
    container_name: lemp-nginx-exporter
    restart: unless-stopped
    command:
      - -nginx.scrape-uri=http://reverse-proxy/nginx_status
    depends_on:
      - reverse-proxy
    networks:
      - lemp-network

  # Redis Exporter для мониторинга
  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: lemp-redis-exporter
    restart: unless-stopped
    environment:
      REDIS_ADDR: "redis:6379"
    depends_on:
      - redis
    networks:
      - lemp-network

  # Node Exporter для системных метрик хоста
  node-exporter:
    image: prom/node-exporter:latest
    container_name: lemp-node-exporter
    restart: unless-stopped
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.ignored-mount-points=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    networks:
      - lemp-network

# Loki для централизованного хранения логов
  loki:
    image: grafana/loki:2.9.3
    container_name: lemp-loki
    restart: unless-stopped
    volumes:
      - ./loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - lemp-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3100/ready"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Promtail для сбора логов
  promtail:
    image: grafana/promtail:2.9.3
    container_name: lemp-promtail
    restart: unless-stopped
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - nginx_logs:/var/log/nginx:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    networks:
      - lemp-network

  # PHP-FPM Exporter для app-php-1
  php-fpm-exporter-1:
    image: hipages/php-fpm_exporter:2.2.0
    container_name: lemp-php-fpm-exporter-1
    restart: unless-stopped
    environment:
      PHP_FPM_SCRAPE_URI: "tcp://app-php-1:9000/status"
      PHP_FPM_FIX_PROCESS_COUNT: "true"
    depends_on:
      - app-php-1
    networks:
      - lemp-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9253/metrics"]
      interval: 30s
      timeout: 10s
      retries: 3

  # PHP-FPM Exporter для app-php-2
  php-fpm-exporter-2:
    image: hipages/php-fpm_exporter:2.2.0
    container_name: lemp-php-fpm-exporter-2
    restart: unless-stopped
    environment:
      PHP_FPM_SCRAPE_URI: "tcp://app-php-2:9000/status"
      PHP_FPM_FIX_PROCESS_COUNT: "true"
    depends_on:
      - app-php-2
    networks:
      - lemp-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9253/metrics"]
      interval: 30s
      timeout: 10s
      retries: 3
networks:
  lemp-network:
    driver: bridge

volumes:
  db_data:
  prometheus_data:
  grafana_data:
  nginx_logs:
  php_sessions:
  redis_data:
  loki_data:
