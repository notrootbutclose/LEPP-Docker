services:
  # Nginx как reverse proxy и балансировщик
  reverse-proxy:
    image: nginx:alpine
    container_name: lepp-reverse-proxy
    restart: unless-stopped
    volumes:
      - ./reverse-proxy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./www:/var/www/html:ro
      - nginx_logs:/var/log/nginx
    ports:
      - "80:80"
    depends_on:
      - app-php-1
      - app-php-2
    networks:
      - lepp-network
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

  # PHP-FPM Backend 1
  app-php-1:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: lepp-app-php-1
    restart: unless-stopped
    volumes:
      - ./www:/var/www/html:rw
      - ./app/php-fpm.d/www.conf:/usr/local/etc/php-fpm.d/www.conf:ro
      - php_sessions:/var/lib/php/sessions
    environment:
      - PHP_MEMORY_LIMIT=${PHP_MEMORY_LIMIT}
      - PHP_MAX_EXECUTION_TIME=${PHP_MAX_EXECUTION_TIME}
      - PHP_UPLOAD_MAX_FILESIZE=${PHP_UPLOAD_MAX_FILESIZE}
      - PHP_POST_MAX_SIZE=${PHP_POST_MAX_SIZE}
      - POSTGRES_HOST=db
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    expose:
      - "9000"
    depends_on:
      - db
      - redis
    networks:
      - lepp-network

  # PHP-FPM Backend 2
  app-php-2:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: lepp-app-php-2
    restart: unless-stopped
    volumes:
      - ./www:/var/www/html:rw
      - ./app/php-fpm.d/www.conf:/usr/local/etc/php-fpm.d/www.conf:ro
      - php_sessions:/var/lib/php/sessions
    environment:
      - PHP_MEMORY_LIMIT=${PHP_MEMORY_LIMIT}
      - PHP_MAX_EXECUTION_TIME=${PHP_MAX_EXECUTION_TIME}
      - PHP_UPLOAD_MAX_FILESIZE=${PHP_UPLOAD_MAX_FILESIZE}
      - PHP_POST_MAX_SIZE=${PHP_POST_MAX_SIZE}
      - POSTGRES_HOST=db
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    expose:
      - "9000"
    depends_on:
      - db
      - redis
    networks:
      - lepp-network

  # PostgreSQL база данных
  db:
    image: postgres:16-alpine
    container_name: lepp-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    networks:
      - lepp-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis для кэширования
  redis:
    image: redis:7-alpine
    container_name: lepp-redis
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - lepp-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Prometheus для сбора метрик
  prometheus:
    image: prom/prometheus:latest
    container_name: lepp-prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    ports:
      - "9090:9090"
    networks:
      - lepp-network

  # Grafana для визуализации
  grafana:
    image: grafana/grafana:latest
    container_name: lepp-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}
      # - GF_INSTALL_PLUGINS=${GF_INSTALL_PLUGINS}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/datasources:/etc/grafana/provisioning/datasources:ro
    depends_on:
      - prometheus
    networks:
      - lepp-network

  # PostgreSQL Exporter
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: lepp-postgres-exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_EXPORTER_USER}:${POSTGRES_EXPORTER_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable"
    ports:
      - "9187:9187"
    depends_on:
      - db
    networks:
      - lepp-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9187/metrics"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Nginx Exporter
  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:latest
    container_name: lepp-nginx-exporter
    restart: unless-stopped
    command:
      - -nginx.scrape-uri=http://reverse-proxy/nginx_status
    ports:
      - "9113:9113"
    depends_on:
      - reverse-proxy
    networks:
      - lepp-network

  # Redis Exporter
  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: lepp-redis-exporter
    restart: unless-stopped
    environment:
      REDIS_ADDR: "redis:6379"
    ports:
      - "9121:9121"
    depends_on:
      - redis
    networks:
      - lepp-network

  # Node Exporter для системных метрик
  node-exporter:
    image: prom/node-exporter:latest
    container_name: lepp-node-exporter
    restart: unless-stopped
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.ignored-mount-points=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    ports:
      - "9100:9100"
    networks:
      - lepp-network

  # Loki для логов
  loki:
    image: grafana/loki:2.9.3
    container_name: lepp-loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - ./loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - lepp-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3100/ready"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Promtail для сбора логов
  promtail:
    image: grafana/promtail:2.9.3
    container_name: lepp-promtail
    restart: unless-stopped
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - nginx_logs:/var/log/nginx:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    networks:
      - lepp-network

  # PHP-FPM Exporter для app-php-1
  php-fpm-exporter-1:
    image: hipages/php-fpm_exporter:2.2.0
    container_name: lepp-php-fpm-exporter-1
    restart: unless-stopped
    environment:
      PHP_FPM_SCRAPE_URI: "tcp://app-php-1:9000/status"
      PHP_FPM_FIX_PROCESS_COUNT: "true"
    ports:
      - "9253:9253"
    depends_on:
      - app-php-1
    networks:
      - lepp-network

  # PHP-FPM Exporter для app-php-2
  php-fpm-exporter-2:
    image: hipages/php-fpm_exporter:2.2.0
    container_name: lepp-php-fpm-exporter-2
    restart: unless-stopped
    environment:
      PHP_FPM_SCRAPE_URI: "tcp://app-php-2:9000/status"
      PHP_FPM_FIX_PROCESS_COUNT: "true"
    ports:
      - "9254:9253"
    depends_on:
      - app-php-2
    networks:
      - lepp-network

networks:
  lepp-network:
    driver: bridge

volumes:
  db_data:
  prometheus_data:
  grafana_data:
  nginx_logs:
  php_sessions:
  redis_data:
  loki_data:
